name: Synchronize pnpm lockfile for authentication preview

on:
  push:
    branches:
      - feature/auth-email-google
    paths:
      - .github/workflows/sync-auth-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: feature/auth-email-google
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile without running package scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit regenerated lockfile to development branch only
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile was already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(auth): synchronize pnpm lockfile"
          git push origin HEAD:feature/auth-email-google
